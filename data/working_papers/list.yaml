works:
  - title: "Breaking Caste Boundaries? Evidence on Village Head Identity and Occupational Structure"
    pdflink: ""   # add later, e.g. "/pdf/Ojha_BreakingCasteBoundaries.pdf"
    book: "Working Paper"
    coauthors: ""
    links: []
    abstract: >
      This paper examines how caste-based political leadership affects occupational mobility and segregation in
      rural India. Leveraging the exogenous rotation of Panchayat seat reservations mandated under Article 243D
      of the Constitution, I identify the causal effect of village head caste identity on labor market outcomes.
      Descriptive patterns suggest high-caste leadership reinforces intergenerational persistence in caste-linked
      work, while low-caste leadership is associated with transitions into service and professional roles. Regression
      results are consistent with these patterns: villages led by low-caste heads exhibit lower caste segregation
      (measured by the Duncan Index) and greater occupational mobility, including in instrumental-variable
      specifications. The findings highlight both representation effects and a role for demographic composition,
      contributing to broader debates on caste norms, inequality, and economic development.
