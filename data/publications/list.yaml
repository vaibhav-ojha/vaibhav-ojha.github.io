works:
  - title: "Remote Work, Selection, and Wage Setting"
    pdflink: ""   # add later, e.g. "/pdf/Ojha_RemoteWork_JMP.pdf"
    book: "Job Market Paper"
    coauthors: ""
    links: []
    abstract: >
      Remote work expanded sharply after 2020 and remains a durable feature of the U.S. labor market, raising
      new questions about how wages are set in hybrid work environments. Using American Community Survey data
      from 2017–2023, I study the evolution of the remote–on-site wage gap and disentangle treatment effects from
      time-varying selection into remote work. Reduced-form estimates show a reversal from a pre-2020 remote
      wage penalty to a post-2020 wage premium, but coefficient-stability diagnostics and Heckman selection
      models indicate substantial shifts in sorting around the pandemic, with evidence of negative selection into
      remote work. In contrast, instrumental-variables estimates exploiting occupation-level telework feasibility
      identify a positive causal effect of remote work on earnings. I reconcile these findings and connect wage
      evidence to remote adoption using a sufficient-statistic framework that maps sectoral wage moments and
      amenities into remote participation; a path-independent decomposition suggests amenities explain a large
      share of the post-2020 rise in remote work.
